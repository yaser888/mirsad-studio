[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mirsad-agent"
version = "0.3.0"
description = "Mirsad Agent - a local-first AI agent with a hardened desktop studio and a full terminal runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mirsad Agent" }]
keywords = ["ai", "agent", "desktop", "cli", "llm", "developer-tools"]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mirsad = "mirsad.cli:main"
mirsad-studio = "mirsad.desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["mirsad"]

[tool.hatch.build.targets.sdist]
include = ["mirsad", "tests", "docs", "site", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PIE", "RUF"]

[tool.ruff.format]
quote-style = "double"
