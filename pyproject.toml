[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mirsad-agent"
version = "0.1.0"
description = "Mirsad Agent - a multi-step AI agent CLI with tools, persistent memory, and multi-provider LLM support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mirsad Agent" }]
keywords = ["ai", "agent", "cli", "llm", "developer-tools"]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mirsad = "mirsad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mirsad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
